services:
  # ── Node.js Backend API ────────────────────────────
  - type: web
    name: aegis-vantage-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 22.13.0
      - key: MONGODB_URI
        sync: false  # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_2FA_CHALLENGE_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false  # set to your Vercel frontend URL

  # ── Python ML Microservice ─────────────────────────
  - type: web
    name: aegis-model-service
    runtime: python
    plan: free
    region: oregon
    rootDir: microservices/model_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
