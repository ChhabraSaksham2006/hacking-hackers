# ==============================================================================
# 4. BENCHMARK SETTINGS SPECIFICATION
# ==============================================================================
benchmark_settings:
  setting_a:
    name: "Setting A — Seen Attack Generalization"
    description: "Evaluates ability to forecast recurrences and new episodes of known attack types with identical training/testing attack taxonomy."
    split_strategy: "70% Train / 15% Val / 15% Test chronological split of known attack episodes."
    included_families: ["BruteForce", "DoS", "DDoS", "WebAttack"]
    training_episodes: 255
    validation_episodes: 56
    testing_episodes: 62
    testing_isolated_onsets: 50
    embargo_buffer_windows: 20  # >= P + K to prevent sequence overlap

  setting_b:
    name: "Setting B — Mixed Generalization"
    description: "Simulates realistic enterprise deployment where the model trains on earlier operational days and evaluates on future days containing both known and newly emerging threats."
    split_strategy: "Chronological multi-day split: Days 1-5 Train, Day 6 Val, Days 7-9 Mixed Test."
    train_days: ["Wednesday-14-02-2018", "Thursday-15-02-2018", "Friday-16-02-2018", "Wednesday-21-02-2018", "Thursday-22-02-2018"]
    val_days: ["Friday-23-02-2018"]
    test_days: ["Wednesday-28-02-2018", "Thursday-01-03-2018", "Friday-02-03-2018"]
    evaluation_reporting: "Split into overall metrics, known family metrics, and unseen family metrics."

  setting_c:
    name: "Setting C — Strict Out-of-Distribution / Zero-Day Generalization"
    description: "Strict zero-day intrusion forecasting benchmark. Model is trained only on DoS, DDoS, Brute Force, and Web Attacks, and evaluated exclusively on unseen Infiltration and Botnet attack episodes."
    split_strategy: "Known families in Train/Val; Unseen families (Infiltration & Botnet) strictly isolated to Test."
    train_days: ["Wednesday-14-02-2018", "Thursday-15-02-2018", "Friday-16-02-2018", "Wednesday-21-02-2018", "Thursday-22-02-2018"]
    val_days: ["Friday-23-02-2018"]
    test_days: ["Wednesday-28-02-2018", "Thursday-01-03-2018", "Friday-02-03-2018"]
    test_target_families: ["Infiltration", "Botnet"]
    test_isolated_onsets: 7

# ==============================================================================
# 5. TARGET FORECASTING TASKS & EVALUATION SCHEMAS
# ==============================================================================
forecasting_tasks:
  task_1_state_rollout:
    target_name: "Continuous Multi-Horizon State Forecasting"
    mathematical_form: "hat_S_{t+1:t+K} in R^{K x 54}"
    ground_truth: "S_{t+1:t+K} in R^{K x 54}"
    loss_functions: ["MSE", "MAE"]
    primary_metrics:
      - overall_mae
      - overall_mse
      - horizon_mae_k1
      - horizon_mae_k3
      - horizon_mae_k5
      - horizon_mae_k10

  task_2_attack_occurrence:
    target_name: "Binary Attack Occurrence Forecasting"
    mathematical_form: "hat_p_{t+K} in [0, 1]"
    ground_truth: "y_{t+K} in {0, 1}"
    loss_function: "BCEWithLogitsLoss / FocalLoss"
    primary_metrics:
      - precision
      - recall
      - macro_f1
      - pr_auc
      - roc_auc
      - false_positive_rate_fpr

  task_3_family_classification:
    target_name: "Threat Family Multi-Class Classification"
    mathematical_form: "hat_c_{t+K} in Delta^6"
    ground_truth: "c_{t+K} in {0, 1, 2, 3, 4, 5, 6}"
    loss_function: "CrossEntropyLoss"
    primary_metrics:
      - multiclass_macro_f1
      - per_family_f1
      - per_family_recall
      - confusion_matrix

  task_4_onset_early_warning:
    target_name: "Proactive Attack Onset Early Warning"
    mathematical_form: "tau-calibrated warning trigger t_warn prior to onset t_onset"
    ground_truth: "Isolated attack onsets (preceded by >= 10 benign windows)"
    primary_metrics:
      - onset_event_recall          # Fraction of attack onsets predicted >= 2s prior
      - median_lead_time_seconds    # Median warning lead time (seconds)
      - mean_lead_time_seconds      # Mean warning lead time (seconds)
      - false_alarms_per_hour       # FA/hr during benign operations
      - mean_time_between_fa_hours  # MTBFA (hours)

  task_5_zero_day_generalization:
    target_name: "Zero-Day Threat Anomaly & Precursor Detection"
    mathematical_form: "Energy / Latent NLL / Recon Anomaly Score on Setting C"
    ground_truth: "Infiltration and Botnet test onsets"
    primary_metrics:
      - zero_day_onset_recall
      - zero_day_pr_auc
      - zero_day_fpr

# ==============================================================================
# 6. ANTI-LEAKAGE AND SCIENTIFIC RIGOR RULES
# ==============================================================================
scientific_rules:
  rule_1_zero_episode_fragmentation:
    enforced: true
    description: "An attack episode must reside entirely within Train, Val, or Test. No episode is ever split."
  rule_2_training_only_normalization:
    enforced: true
    description: "StandardScaler mean and std are computed strictly on the designated Training split. Test and Val are transformed using fitted Training scalers."
  rule_3_validation_only_threshold_tuning:
    enforced: true
    description: "Decision thresholds (tau) for binary classification and onset detection must be calibrated solely on the Validation split."
  rule_4_temporal_embargo_buffers:
    enforced: true
    buffer_windows: 20
    description: "A minimum embargo buffer of P + K = 20 windows (40s) is enforced at all within-day split boundaries so no sliding window sequence spans across partitions."
  rule_5_unadulterated_ground_truth:
    enforced: true
    description: "No metrics may be fabricated or inferred from partial evaluations. Every reported metric must have a verifiable JSON/CSV execution artifact."
