benchmark_metadata:
  contract_version: "2.0-hardened"
  project_id: "SIH26153"
  project_title: "AI based Network Attack Forecasting from Network Traffic Data"
  target_organization: "NTRO"
  dataset_source: "CSE-CIC-IDS2018 (Canonical Temporal Telemetry)"
  total_capture_days: 9
  total_raw_windows: 188520
  total_attack_episodes: 373
  total_isolated_onsets: 292

# ==============================================================================
# 1. FROZEN GLOBAL TEMPORAL CONSTANTS
# ==============================================================================
temporal_contract:
  window_duration_seconds: 10.0      # W: Duration of sliding window
  stride_seconds: 2.0               # S: Stride between consecutive windows
  overlap_ratio: 0.80               # Overlap between consecutive windows (80%)
  
  lookback_steps_P: 10              # P: 10 historical lookback steps (20.0 seconds)
  lookback_duration_seconds: 20.0
  
  forecast_horizon_steps_K: 10      # K: 10 rollout forecast steps (20.0 seconds)
  forecast_duration_seconds: 20.0
  
  evaluated_rollout_steps: [1, 3, 5, 10]
  step_duration_mapping:
    k_1: 2.0    # 1 step = 2 seconds ahead
    k_3: 6.0    # 3 steps = 6 seconds ahead
    k_5: 10.0   # 5 steps = 10 seconds ahead
    k_10: 20.0  # 10 steps = 20 seconds ahead

