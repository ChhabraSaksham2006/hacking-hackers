services:
  - type: web
    name: aegis-model-service
    runtime: python
    plan: free
    region: oregon
    rootDir: microservices/model_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
